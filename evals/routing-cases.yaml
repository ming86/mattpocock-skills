# Lightweight semantic routing cases for workflow-skills.
#
# These are not a mandatory execution pipeline or a harness-specific test suite.
# They preserve intended boundaries between neighboring skills so future trigger
# description changes can be checked against representative prompts.
#
# invocation:
#   implicit-ok   -> the skill is eligible for model invocation in supported harnesses
#   explicit-only -> the skill may be the semantic match, but automatic model invocation
#                    is disabled; deliberate invocation follows the current harness rules
#
# For workflow-guide cases, `candidate` records the explicit workflow the guide should
# identify. Project or user instructions decide whether and how to enter that workflow.

cases:
  - id: diagnose-intermittent-double-charge
    prompt: "Why does checkout occasionally charge a customer twice? We do not know the cause yet."
    expected:
      skill: diagnosing-bugs
      invocation: implicit-ok
    avoid: [research, prototype]

  - id: research-vendor-webhook-contract
    prompt: "What does the payment provider officially guarantee about webhook retry timing?"
    expected:
      skill: research
      invocation: implicit-ok
    avoid: [diagnosing-bugs, prototype]

  - id: prototype-browser-iframe-behavior
    prompt: "Use $prototype. We cannot tell from the docs whether this browser API actually works inside our sandboxed iframe, and a tiny experiment would settle it."
    expected:
      skill: prototype
      invocation: explicit-only
    avoid: [research, diagnosing-bugs]

  - id: grill-user-owned-product-decision
    prompt: "I have not decided whether admins should be allowed to bypass the approval step. Help me work through the decision."
    expected:
      skill: grilling
      invocation: implicit-ok
    avoid: [to-questionnaire, research]

  - id: grill-with-existing-design-docs
    prompt: "Use $grill-with-docs to help me settle the remaining authorization design choices using the existing ADRs and codebase."
    expected:
      skill: grill-with-docs
      invocation: explicit-only
    avoid: [grilling, research]

  - id: questionnaire-external-domain-owner
    prompt: "Use $to-questionnaire. Finance owns the rule for whether a settled invoice may be cancelled; prepare the questions we need them to answer."
    expected:
      skill: to-questionnaire
      invocation: explicit-only
    avoid: [grilling, research]

  - id: domain-modeling-terminology
    prompt: "Our code uses customer, account, tenant, and organization inconsistently. Help establish the concepts, relationships, and invariants."
    expected:
      skill: domain-modeling
      invocation: implicit-ok
    avoid: [codebase-design, grilling]

  - id: codebase-design-module-boundary
    prompt: "Should these three thin modules remain separate or become one deeper module with a smaller interface?"
    expected:
      skill: codebase-design
      invocation: implicit-ok
    avoid: [domain-modeling, implementation-review, simplify-by-ablation]

  - id: simplify-by-ablation-overengineered-design
    prompt: "Which parts of this design are actually earning their complexity? Do an ablation pass and simplify anything whose absence loses nothing material."
    expected:
      skill: simplify-by-ablation
      invocation: implicit-ok
    avoid: [codebase-design, implementation-review]

  - id: simplify-by-ablation-existing-implementation
    prompt: "This implementation feels overengineered. Identify abstractions or supporting machinery that are not materially contributing and simplify them."
    expected:
      skill: simplify-by-ablation
      invocation: implicit-ok
    avoid: [implementation-review, codebase-design]

  - id: tdd-requested
    prompt: "Implement this behavior test-first with a tight red-green-refactor loop."
    expected:
      skill: tdd
      invocation: implicit-ok
    avoid: [diagnosing-bugs, implementation-review]

  - id: ordinary-change-does-not-imply-tdd
    prompt: "Reduce allocations in this hot path and run the relevant existing checks. Test-first development is not part of the request."
    expected:
      skill: null
      invocation: none
    avoid: [tdd, codebase-design, diagnosing-bugs]

  - id: wayfinder-long-running-uncertainty
    prompt: "Use $wayfinder for this migration. It will span several sessions and we still have unresolved architecture and rollout decisions."
    expected:
      skill: wayfinder
      invocation: explicit-only
    avoid: [handoff, to-spec]

  - id: handoff-imminent-context-switch
    prompt: "Use $handoff. I am moving this work to a fresh session; package only what the next context needs to resume from here."
    expected:
      skill: handoff
      invocation: explicit-only
    avoid: [wayfinder, to-spec]

  - id: spec-from-settled-understanding
    prompt: "Use $to-spec to turn the decisions we have already settled into an implementation-ready specification."
    expected:
      skill: to-spec
      invocation: explicit-only
    avoid: [wayfinder, grilling]

  - id: tickets-from-settled-plan
    prompt: "Use $to-tickets to break this approved implementation plan into dependency-aware work units."
    expected:
      skill: to-tickets
      invocation: explicit-only
    avoid: [to-spec, implement]

  - id: implement-bounded-ticket
    prompt: "Use $implement to execute ticket AUTH-142 exactly as scoped."
    expected:
      skill: implement
      invocation: explicit-only
    avoid: [to-spec, to-tickets]

  - id: implementation-review-bounded-patch
    prompt: "Use $implementation-review on this completed patch. Check requested behavior and repository integration."
    expected:
      skill: implementation-review
      invocation: explicit-only
    avoid: [codebase-design, diagnosing-bugs]

  - id: routine-ticket-completion-no-extra-review-workflow
    prompt: "This small ticket is implemented and its relevant existing check passes. Continue with the next already-planned ticket."
    expected:
      skill: null
      invocation: none
    avoid: [workflow-guide, implementation-review, tdd]

  - id: resolve-in-progress-merge
    prompt: "Use $resolving-merge-conflicts on the merge Git has stopped on. Recover why both sides changed this code before reconciling it."
    expected:
      skill: resolving-merge-conflicts
      invocation: explicit-only
    avoid: [diagnosing-bugs, implement]

  - id: completed-merge-regression-is-debugging
    prompt: "The merge completed yesterday, but authentication is now failing in production. Find the cause."
    expected:
      skill: diagnosing-bugs
      invocation: implicit-ok
    avoid: [resolving-merge-conflicts, implementation-review]

  - id: docs-can-answer-no-prototype
    prompt: "Check the framework source and official docs to determine whether this callback runs before transaction commit."
    expected:
      skill: research
      invocation: implicit-ok
    avoid: [prototype, diagnosing-bugs]

  - id: observed-failure-no-research
    prompt: "This test flakes only under parallel execution. We need evidence that distinguishes the race-condition hypotheses."
    expected:
      skill: diagnosing-bugs
      invocation: implicit-ok
    avoid: [research, prototype]

  - id: current-user-not-external-questionnaire
    prompt: "The choice is mine: should this CLI default to destructive cleanup or require an explicit flag? Ask me the important questions."
    expected:
      skill: grilling
      invocation: implicit-ok
    avoid: [to-questionnaire, grill-with-docs]

  - id: no-questionnaire-when-repo-has-answer
    prompt: "The product manager thinks retention is 30 days, but the answer should already be in the contract and repository docs. Establish what they actually say."
    expected:
      skill: research
      invocation: implicit-ok
    avoid: [to-questionnaire, grilling]

  - id: wayfinder-not-handoff
    prompt: "Use $wayfinder to maintain the durable decision map for this uncertain six-week rewrite; no session transition is happening right now."
    expected:
      skill: wayfinder
      invocation: explicit-only
    avoid: [handoff, to-tickets]

  - id: handoff-not-wayfinder
    prompt: "Use $handoff for the next agent. The durable plan already exists; capture only where execution stopped and what to do next."
    expected:
      skill: handoff
      invocation: explicit-only
    avoid: [wayfinder, to-spec]

  - id: small-change-no-workflow-expansion
    prompt: "Change the typo in this error message and update the existing expectation."
    expected:
      skill: null
      invocation: none
    avoid: [workflow-guide, to-spec, to-tickets, wayfinder, prototype]

  - id: inspect-domain-before-structure
    prompt: "We cannot decide module boundaries because nobody agrees what a Subscription, Plan, and Entitlement mean or how they relate."
    expected:
      skill: domain-modeling
      invocation: implicit-ok
    avoid: [codebase-design, to-spec]

  - id: architecture-with-domain-settled
    prompt: "The domain model is settled. Decide whether policy evaluation belongs behind one module interface or remains spread across callers."
    expected:
      skill: codebase-design
      invocation: implicit-ok
    avoid: [domain-modeling, to-spec]

  - id: routine-call-site-inspection-no-research
    prompt: "Find every call site of parseConfig() in this repository and show me the files."
    expected:
      skill: null
      invocation: none
    avoid: [research, codebase-design]

  - id: existing-glossary-lookup-no-domain-modeling
    prompt: "What does Customer mean in this project? Read the existing glossary and tell me the current definition; do not redesign the model."
    expected:
      skill: null
      invocation: none
    avoid: [domain-modeling, research]

  - id: codebase-design-does-not-imply-alternative-generation
    prompt: "Review whether this existing module interface is sensible and suggest the smallest design improvement if one is needed."
    expected:
      skill: codebase-design
      invocation: implicit-ok
    avoid: [domain-modeling, implementation-review]
    note: "Do not automatically run Design It Twice. Compare alternative interfaces only when the user asks or a material interface decision cannot be resolved reliably without comparison."

  - id: ordinary-implementation-judgment-no-grilling
    prompt: "This private helper can return either a tuple or a small object. Pick the form that best fits the surrounding code; no public behavior or product choice depends on it."
    expected:
      skill: null
      invocation: none
    avoid: [grilling, grill-with-docs]

  - id: questionnaire-external-expertise-not-decision-owner
    prompt: "Use $to-questionnaire. Our infrastructure specialist is the only person who knows the current failover setup, and we need that context before we can finish the migration plan."
    expected:
      skill: to-questionnaire
      invocation: explicit-only
    avoid: [grilling, research]

  - id: guide-suggest-prototype-after-research-stalls
    prompt: "We checked the official docs and source, but they still do not establish whether this browser behavior works in our sandbox. A small experiment would settle the remaining uncertainty."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: prototype
    avoid: [research, diagnosing-bugs]

  - id: guide-suggest-wayfinder-for-cross-context-work
    prompt: "This migration is now spanning several sessions, with unresolved rollout and architecture decisions that we keep reconstructing after context changes."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: wayfinder
    avoid: [handoff, to-spec]

  - id: guide-suggest-questionnaire-for-external-owner
    prompt: "We cannot finish the cancellation rules because Finance owns several policy decisions and neither I nor the repository can answer them."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: to-questionnaire
    avoid: [grilling, research]

  - id: guide-suggest-grill-before-dependent-planning
    prompt: "The repository narrows this authorization design to two viable choices, but the product decision is mine and the implementation plan will differ materially depending on which we choose."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: grill-with-docs
    avoid: [grilling, to-spec, implement]

  - id: guide-suggest-spec-before-dependent-implementation
    prompt: "We have settled the behavior, interfaces, and important constraints. Implementation is about to begin across later sessions, but those decisions still exist mostly in this conversation."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: to-spec
    avoid: [wayfinder, grilling, implement]

  - id: guide-suggest-tickets-before-multi-unit-execution
    prompt: "The implementation plan is settled and contains several independently executable pieces with real dependencies. We are about to start work across multiple focused sessions."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: to-tickets
    avoid: [to-spec, implement, wayfinder]

  - id: guide-suggest-handoff-before-context-switch
    prompt: "I am about to move this work to a fresh session. The durable spec and tickets already exist, but the current execution state and immediate next step only exist in this context."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: handoff
    avoid: [wayfinder, to-spec]

  - id: guide-suggest-review-after-bounded-implementation
    prompt: "This bounded implementation is complete and its tests pass. Before I treat the patch as settled, I want a focused check that it actually matches the requested behavior and integrates cleanly with the repository."
    expected:
      skill: workflow-guide
      invocation: implicit-ok
    candidate: implementation-review
    avoid: [codebase-design, diagnosing-bugs]

  - id: guide-does-not-sell-workflow-for-simple-change
    prompt: "Update this existing error message and its matching test expectation. The scope and desired text are already clear."
    expected:
      skill: null
      invocation: none
    avoid: [workflow-guide, implement, to-spec, to-tickets, prototype, wayfinder, simplify-by-ablation]
